experimentName: "mobilenetV2Baseline"
dataDir: "data/baseline/train"
splitDir: "data/splits"
outputDir: "artifacts/mobilenetV2Baseline"

modelName: "mobilenetv2_100"
imageSize: 224
freezeBackbone: false

# Thông số chuẩn hóa (Mặc định: ImageNet)
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

batchSize: 32
numEpochs: 15
learningRate: 0.001
weightDecay: 0.0001
numWorkers: 2
topK: 3
device: "auto"

# ─────────────────────────────────────────────────────────────────
# Class imbalance handling
# ─────────────────────────────────────────────────────────────────
# Baseline KHÔNG dùng WeightedRandomSampler để minh họa vấn đề class imbalance.
useWeightedSampler: false

# Có thể bật thêm class weights cho CrossEntropyLoss (thường thì dùng sampler là đủ)
useClassWeights: false

# ─────────────────────────────────────────────────────────────────
# Cấu hình Augmentation
# Tất cả giá trị ánh xạ trực tiếp tới các trường AugConfig
# trong src/data/dataTransforms.py
# ─────────────────────────────────────────────────────────────────
augmentation:

  # ── Hình học ───────────────────────────────────────────────────
  # Xoay 180°: hướng lá hoàn toàn ngẫu nhiên trong ảnh thực địa.
  # Có thể tăng lên 360 nếu muốn — an toàn về mặt sinh học.
  rotationDegrees: 180

  # Scale của RandomResizedCrop: 0.70 đảm bảo không crop mất tổn thương.
  # KHÔNG giảm xuống dưới 0.60 — nguy cơ cắt mất tổn thương trên lá nhỏ.
  cropScaleMin: 0.70
  cropScaleMax: 1.00

  # Flip ngang và dọc: lá bị lật vẫn là cùng một loại bệnh.
  hflip: true
  vflip: true

  # Biến dạng đàn hồi: mô phỏng độ cong / nhăn của bề mặt lá.
  # Đã tắt cho model baseline.
  elasticEnabled: false
  elasticAlpha: 30.0   # biên độ dịch chuyển — giữ thấp để không phá hình dạng tổn thương
  elasticSigma: 5.0    # hệ số làm mượt
  elasticP: 0.30       # áp dụng 30% thời gian

  # ── Màu sắc ────────────────────────────────────────────────────
  brightnessJitter: 0.25   # biến động ánh sáng thực địa — phạm vi an toàn
  contrastJitter: 0.20     # biến động do mây che / bóng râm — phạm vi an toàn
  saturationJitter: 0.10   # dịch chuyển white-balance camera — giữ bảo thủ

  # !!! TUYỆT ĐỐI KHÔNG ĐẶT hueJitter KHÁC 0 !!!
  # Màu sắc bệnh (vàng lá úa, đốm nâu tổn thương, đốm đỏ) là tín hiệu
  # chẩn đoán cốt lõi. Thay đổi hue tổng hợp ra mẫu không hợp lệ về y học.
  hueJitter: 0.00

  # ── Làm mờ ─────────────────────────────────────────────────────
  # Đã tắt cho model baseline.
  blurEnabled: false
  blurKernelMin: 3      # phải là số lẻ; 3 = mờ nhẹ nhất có thể
  blurKernelMax: 5      # giữ nhỏ — bảo toàn chi tiết texture tổn thương
  blurSigmaMin: 0.1
  blurSigmaMax: 1.0
  blurP: 0.20           # xác suất 20% — hầu hết ảnh giữ nguyên độ sắc nét

  # ── Độ sắc nét ─────────────────────────────────────────────────
  # Đã tắt cho model baseline.
  sharpnessEnabled: false
  sharpnessFactor: 1.5   # 1.0 = không đổi, >1 = sắc hơn
  sharpnessP: 0.20

  # ── Xóa vùng nhỏ ───────────────────────────────────────────────
  # Đã tắt cho model baseline.
  eraseEnabled: false
  eraseScaleMin: 0.02   # 2% diện tích ảnh — rất nhỏ
  eraseScaleMax: 0.08   # tối đa 8% diện tích ảnh — vẫn còn nhỏ
  eraseRatio: 1.0       # chỉ patch vuông (dự đoán được)
  eraseP: 0.20
  
  # ── Anti background shortcuts ──────────────────────────────────
  # Đã tắt cho model baseline.
  coarseDropoutEnabled: false
  coarseDropoutMaxHoles: 6
  coarseDropoutHoleHeight: 16
  coarseDropoutHoleWidth: 16
  coarseDropoutP: 0.30
  
  gaussNoiseEnabled: false
  gaussNoiseVarMin: 5.0
  gaussNoiseVarMax: 25.0
  gaussNoiseP: 0.25
  
  grayscaleP: 0.00

# ─────────────────────────────────────────────────────────────────
# Staged Fine-tuning
# ─────────────────────────────────────────────────────────────────
# useStagedFinetuning: Bật chế độ huấn luyện 2 giai đoạn.
#   Giai đoạn 1 (epoch 1 → headOnlyEpochs): Chỉ train classifier head.
#   Giai đoạn 2 (epoch headOnlyEpochs+1 → numEpochs): Unfreeze toàn backbone,
#   optimizer được tạo lại với LR thấp hơn 10x để tránh catastrophic forgetting.
# Khi bật: freezeBackbone bị override thành True tự động cho giai đoạn 1.
useStagedFinetuning: false
headOnlyEpochs: 3

# ─────────────────────────────────────────────────────────────────
# Learning Rate Scheduler
# ─────────────────────────────────────────────────────────────────
# schedulerType:
#   "step"          → StepLR(step_size=3, gamma=0.1) [mặc định — behavior cũ]
#   "cosine"        → CosineAnnealingLR(T_max=numEpochs)
#   "warmup_cosine" → Linear warmup trong warmupEpochs epoch đầu,
#                     sau đó Cosine decay — ổn định nhất cho fine-tune backbone.
schedulerType: "step"

# warmupEpochs: Số epoch warmup (chỉ dùng khi schedulerType="warmup_cosine").
# Trong warmup, LR tăng đều từ ~0 lên learningRate.
# Khuyến nghị 2-5 epoch để tránh shock gradient khi unfreeze backbone.
warmupEpochs: 3

# ─────────────────────────────────────────────────────────────────
# Layer-wise Learning Rate
# ─────────────────────────────────────────────────────────────────
# useLayerLR: Bật 2 param groups với LR khác nhau:
#   - Classifier head: learningRate (trên)
#   - Backbone layers: backboneLR (thấp hơn)
# Hiệu quả nhất khi freezeBackbone=false hoặc ở giai đoạn 2 của staged training.
useLayerLR: false
backboneLR: 0.0001

# ─────────────────────────────────────────────────────────────────
# Custom Pretrained Checkpoint
# ─────────────────────────────────────────────────────────────────
# pretrainedPath: Đường dẫn tới file .pt cục bộ để dùng làm pretrained base.
# Nếu để rỗng → dùng ImageNet pretrained weights từ timm (mặc định).
# Hỗ trợ: full PlantDocAI checkpoint (có key "modelStateDict") hoặc raw state_dict.
# Dùng strict=False → classifier head có thể khác numClasses (keys bị skip sẽ được log).
# Ví dụ: pretrainedPath: "artifacts/efficientnetB0_extended/checkpoints/best.pt"
pretrainedPath: ""
